ai_supply_rupture:
  description: Export controls, a foundry interruption or a memory allocation shock cuts quantity and
    lifts price. Hardware earnings fall on volume even as unit pricing rises, efficiency goes backwards
    because the available silicon is worse, and the breakeven leg moves on the goods-price passthrough.
    Taiwan and Korea carry the concentration, and the gas and power legs are genuinely two-sided -- less
    compute deployed but a more expensive grid -- so they are carried at ambiguous direction rather than
    given a sign the mechanism does not support.
  primary_risk_factors:
  - VIX M1 (vol pts)
  - VIX M2 (vol pts)
  - VSTOXX M1 (vol pts)
  - VIX M3 (vol pts)
  causal_chain:
  - step: 1
    mechanism: An export-control action, foundry interruption or memory allocation shock cuts available
      quantity
    affects:
    - VIX M1 (vol pts)
  - step: 2
    mechanism: Hardware earnings fall on volume even as realised unit pricing rises
    affects:
    - VIX M2 (vol pts)
  - step: 3
    mechanism: Effective efficiency goes backwards -- the available silicon per unit of intelligence is
      worse
    affects:
    - VSTOXX M1 (vol pts)
  - step: 4
    mechanism: Taiwan and Korea take the concentration loss directly
    affects:
    - VIX M3 (vol pts)
  - step: 5
    mechanism: Breakevens rise on goods-price passthrough and the Fed reaction function turns hawkish
    affects:
    - VIX M1 (vol pts)
  - step: 6
    mechanism: Term premium rises with the inflation impulse; the real-rate leg is ambiguous
    affects:
    - VIX M2 (vol pts)
  - step: 7
    mechanism: Gold rallies on the flight and term-premium channels
    affects:
    - VSTOXX M1 (vol pts)
  - step: 8
    mechanism: Gas and power are genuinely two-sided -- less compute deployed against a more expensive
      grid -- so no sign is asserted
    affects:
    - VIX M3 (vol pts)
