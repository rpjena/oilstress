ai_credit_event:
  description: The financing channel breaks before the demand channel does. Off-balance-sheet vehicles,
    GPU-collateralised lending and vendor financing reprice together, and the lowest-rated hyperscaler
    is the transmission point rather than the cause. The earnings path is marked down only modestly; the
    damage is in the risk premium and in the cost of the marginal dollar of capex. Whether the rates leg
    cushions or compounds the equity loss is the single largest uncertainty in the scenario and is priced
    as a mixture, not asserted.
  primary_risk_factors:
  - VIX M1 (vol pts)
  - VSTOXX M1 (vol pts)
  - VIX M2 (vol pts)
  - VIX M3 (vol pts)
  causal_chain:
  - step: 1
    mechanism: A funding event at a leveraged AI borrower -- SPV, vendor financing or GPU-collateralised
      paper -- fails to clear
    affects:
    - VIX M1 (vol pts)
  - step: 2
    mechanism: Tech spreads gap and the lowest-rated hyperscaler becomes the transmission point
    affects:
    - VSTOXX M1 (vol pts)
  - step: 3
    mechanism: New-issue concession widens and the marginal cost of the capex dollar rises
    affects:
    - VIX M2 (vol pts)
  - step: 4
    mechanism: Equity risk premium widens across both buckets; the earnings path is marked down only modestly
    affects:
    - VIX M3 (vol pts)
  - step: 5
    mechanism: Broad IG follows tech with a lag and a smaller beta
    affects:
    - VIX M1 (vol pts)
  - step: 6
    mechanism: Gold rallies on the credit-stress and flight channel plus the real-rate leg
    affects:
    - VSTOXX M1 (vol pts)
  - step: 7
    mechanism: The rates leg is regime-dependent -- flight-to-quality against fiscal and corporate supply
      -- and is carried as a mixture
    affects:
    - VIX M2 (vol pts)
  - step: 8
    mechanism: Deferred gas and power give back the load premium as the buildout financing is questioned
    affects:
    - VIX M3 (vol pts)
