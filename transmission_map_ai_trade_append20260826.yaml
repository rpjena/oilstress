ai_efficiency_shock:
  description: A credible step-change in tokens-per-watt decouples the hardware and platform layers. Aggregate
    compute demand does not fall -- Jevons keeps the capex envelope roughly intact -- but the per-unit
    hardware content of a unit of intelligence does, so the earnings path splits in sign across the two
    buckets. The index barely moves and dispersion does all the work, which is why an index-level VaR
    shows almost nothing here. Implied correlation falls, so index vol can decline even as single-stock
    vol rises.
  primary_risk_factors:
  - VIX M1 (vol pts)
  - Semi-minus-platform (SMP)
  - MSCI Taiwan (TWN)
  - VSTOXX M1 (vol pts)
  causal_chain:
  - step: 1
    mechanism: A credible tokens-per-watt disclosure or open-weight release resets the compute-per-unit-intelligence
      assumption
    affects:
    - VIX M1 (vol pts)
  - step: 2
    mechanism: The hardware earnings path falls while the platform earnings path rises -- opposite signs,
      same shock
    affects:
    - Semi-minus-platform (SMP)
  - step: 3
    mechanism: Semi-minus-platform is the primary expression; the headline index move is second order
    affects:
    - MSCI Taiwan (TWN)
  - step: 4
    mechanism: Implied correlation falls as constituents decouple, so index vol declines while single-stock
      vol rises
    affects:
    - VSTOXX M1 (vol pts)
  - step: 5
    mechanism: Taiwan and Korea underperform the US indices on hardware concentration
    affects:
    - VIX M1 (vol pts)
  - step: 6
