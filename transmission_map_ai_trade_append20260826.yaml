ai_compute_supercycle:
  description: 'Capex is guided up again, memory stays short, and power becomes the binding constraint
    rather than silicon. The earnings path rises for both layers with hardware taking the larger share,
    and efficiency gains are absorbed into volume rather than into lower spend. The discount rate rises
    with it: a real-economy investment boom lifts r-star, and the Fed reaction function under the current
    chair is hawkish, so the equity rally comes with a bond sell-off rather than a rally.'
  primary_risk_factors:
  - VIX M1 (vol pts)
  - VSTOXX M1 (vol pts)
  - VIX M2 (vol pts)
  - VIX M3 (vol pts)
  causal_chain:
  - step: 1
    mechanism: Capex guidance is raised again and the constraint is named as power rather than silicon
    affects:
    - VIX M1 (vol pts)
  - step: 2
    mechanism: Both earnings buckets rise, hardware by more; efficiency gains are absorbed into volume
    affects:
    - VSTOXX M1 (vol pts)
  - step: 3
    mechanism: Power forwards and deferred gas lead the commodity complex; the prompt gas contract lags
      by construction
    affects:
    - VIX M2 (vol pts)
  - step: 4
    mechanism: Uranium moves on narrative beta well ahead of any fundamental balance change
    affects:
    - VIX M3 (vol pts)
  - step: 5
    mechanism: AI-complex risk premium compresses and credit spreads tighten as the funding question recedes
    affects:
    - VIX M1 (vol pts)
  - step: 6
    mechanism: Real rates rise on the investment boom and the Fed reaction function is hawkish
    affects:
    - VSTOXX M1 (vol pts)
  - step: 7
    mechanism: The bond leg sells off with the equity rally -- the stock-bond correlation is positive
      here
    affects:
    - VIX M2 (vol pts)
  - step: 8
    mechanism: Gold falls on the real-rate move despite the risk-on tone, because it is a real-rate instrument
    affects:
    - VIX M3 (vol pts)
