ai_capex_capitulation:
  description: Hyperscaler boards blink on the 2027 capex path after a year in which guidance was raised
    repeatedly and free cash flow went to zero. The earnings hit lands on the hardware layer first and
    hardest, because order books are the thing being cut; the platform layer takes a smaller earnings
    hit and a larger multiple hit. The discount-rate move is genuine but two-sided -- the real-rate leg
    falls on the growth downgrade while the term-premium leg does not fall with it, because the marginal
    seller of duration is a fiscal authority, not an AI story. Deleveraging lands in the memory and foundry
    complex where 2026 positioning is most crowded.
  primary_risk_factors:
  - VIX M1 (vol pts)
  - VIX M2 (vol pts)
  - VSTOXX M1 (vol pts)
  - VIX M3 (vol pts)
  causal_chain:
  - step: 1
    mechanism: A hyperscaler guides the forward capex envelope below consensus and frames it as ROI discipline
    affects:
    - VIX M1 (vol pts)
  - step: 2
    mechanism: Order-book visibility shortens for accelerator, memory and networking suppliers
    affects:
    - VIX M2 (vol pts)
  - step: 3
    mechanism: The hardware bucket earnings path is marked down harder than the platform bucket
    affects:
    - VSTOXX M1 (vol pts)
  - step: 4
    mechanism: AI-complex equity risk premium widens; multiple compression exceeds the earnings move
    affects:
    - VIX M3 (vol pts)
  - step: 5
    mechanism: Taiwan and Korea amplify on concentration and on retail leverage
    affects:
    - VIX M1 (vol pts)
  - step: 6
    mechanism: Credit follows equity -- tech spreads widen while broad IG lags the move
    affects:
    - VIX M2 (vol pts)
  - step: 7
    mechanism: Real rates fall on the growth downgrade but term premium does not follow, because the duration
      supply is fiscal
    affects:
    - VSTOXX M1 (vol pts)
  - step: 8
    mechanism: Deferred gas and power forwards give back the data-center load premium; the prompt gas
      contract barely responds
    affects:
    - VIX M3 (vol pts)
