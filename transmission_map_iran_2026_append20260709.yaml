    - ICE Gasoil (QS)
    - ULSD Heating Oil (HO)
    - RBOB Gasoline (RB)
  - step: 3
    mechanism: disorderly supply shock spikes oil and equity vol from a low base
    affects:
    - OVX Oil Vol (vol pts)
    - VIX (vol pts)
    - VSTOXX (vol pts)
  - step: 4
