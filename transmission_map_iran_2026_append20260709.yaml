# ============================================================================
# ANCHOR DATE: 2026-07-09
# SCENARIO PROBABILITIES: A 0.15 / B 0.50 / C 0.35
# KEY FACTS: Jun-17 MoU signed then broke down (Jul 7-8 US strikes on Kharg +
#   80 targets, Iran hit Kuwait/Bahrain bases, Trump 'truce over' + blockade/
#   Kharg-seizure threats but 'no full war wanted'). Oil +5% off a WEAK
#   physical base (OPEC+ glut) to ~78 Brent; gold FELL to ~4085 despite war;
#   VIX only ~16.9; DXY ~100.76; 10Y ~4.58 (rebounding).
# DIRECTION REVISIONS vs empirical priors table: none. Gold-stalemate '-'
#   is DIRECTLY CONFIRMED this anchor (gold fell on the Jul-8 escalation day).
#
# prior_mean CONVENTION (critical): anchored to the CURRENT (2026-07-09)
#   level, NOT pre-war and NOT the war high. Brent anchor is ~78, not 71.
#   - generic instruments: % change from current price
#   - VIX/VSTOXX: absolute vol-point change from current level
#   - 10Y/HY/EMBI/SOFR3M/Euribor3M: basis-point change from current level
# NOTE: with B as the 0.50 base case, the stalemate column is the central
#   estimate; escalation (C) carries an elevated 0.35 tail this anchor.
# ============================================================================

prior_mean_convention: "All prior_mean values are changes from the 2026-07-09 anchor level (NOT pre-war, NOT the war high). Generic instruments in %, VIX/VSTOXX in absolute vol points, rates/credit (US 10Y Yield, HY E&P, EMBI, SOFR3M, Euribor3M) in basis points."

iran_2026_rapid_resolution:
  description: >
    The signed Jun-17 MoU is restored and honoured: strikes stop, the blockade
    threat is withdrawn and Hormuz normalises under the Oman-administered
    framework. The war premium -- already thin because physical crude is weak
    on OPEC+ supply -- fully exits, so oil and gas drift down toward pre-war
    rather than collapsing. Disinflation revives Fed-cut pricing, pulling the
    front-end down; the mild haven bid in the dollar and long-end unwinds and
    EM/petro-credit compresses. Qatar LNG damage, shut-in restart lags, low EU
    storage and a July heatwave floor the gas move.
  primary_risk_factors:
  - Brent Crude (CB)
  - TTF Nat Gas (TTF)
  causal_chain:
  - step: 1
    mechanism: MoU restored and blockade threat withdrawn so the residual chokepoint premium leaves crude
    affects:
    - Brent Crude (CB)
    - WTI Crude (CL)
    - Dubai Crude (DC)
  - step: 2
    mechanism: Hormuz LNG transit renormalises so European gas and distillate ease, floored by low storage and heatwave
    affects:
    - TTF Nat Gas (TTF)
    - ICE Gasoil (QS)
    - ULSD Heating Oil (HO)
    - RBOB Gasoline (RB)
  - step: 3
    mechanism: lower energy trims the inflation tail so oil and equity vol fall from already-low levels
    affects:
    - OVX Oil Vol (vol pts)
    - VIX (vol pts)
    - VSTOXX (vol pts)
  - step: 4
    mechanism: disinflation revives rate-cut pricing so front-end rates fall and equities rally
    affects:
    - SOFR3M (SQ)
    - S&P 500 (ES)
    - NASDAQ
    - Euro STOXX 50 (FESX)
    - DAX 40 (FDAX)
  - step: 5
    mechanism: the mild war-risk dollar and long-end bid unwinds
    affects:
    - US 10Y Yield (ZN)
    - USD Index DXY
    - EUR/USD (6E)
  - step: 6
    mechanism: lower oil import bills relieve oil-importer FX while the USD haven bid fades
    affects:
    - USD/JPY (6J)
    - USD/INR (INR)
  - step: 7
    mechanism: risk-on and growth relief compress sovereign and energy-HY credit
    affects:
    - EMBI Sovereign Spread
    - HY E&P Credit Spread
  - step: 8
    mechanism: petrocurrencies soften with oil while the USD bid fades; energy equities lag crude down
    affects:
    - USD/NOK (NOK)
    - USD/CAD (6C)
    - S&P Energy Sector (XLE)
