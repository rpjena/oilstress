    - EUR/USD (6E)
    - SOFR3M (SQ)
  - step: 4
    mechanism: hawkish-Fed plus strong-USD plus real-rate channel pressures gold despite the conflict
    affects:
    - Gold (GC)
  - step: 5
    mechanism: grinding inflation risk keeps oil vol firm while equity vol stays moderately elevated
    affects:
    - OVX Oil Vol (vol pts)
    - VIX (vol pts)
    - VSTOXX (vol pts)
  - step: 6
