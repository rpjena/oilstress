iran_2026_extended_stalemate:
  description: >
    BASE CASE (0.50). The signed MoU survives on paper but is not honoured:
    intermittent US-Iran strikes continue, Iran presses toll/control over
    Hormuz, and insurance and traffic do not normalise. The war premium grinds
    higher on top of a weak physical crude base rather than spiking. Sticky
    energy plus a hawkish, 9-9-split Fed keep real yields elevated, so gold is
    pressured by the USD/real-rate channel rather than bid as a haven -- a
    dynamic directly observed at this anchor, where gold fell on an escalation
    day. Oil-importer FX and EM credit deteriorate; US energy HY compresses as
    higher oil supports cash flow.
  primary_risk_factors:
  - Brent Crude (CB)
  - TTF Nat Gas (TTF)
  causal_chain:
  - step: 1
    mechanism: MoU unhonoured and strikes recur so the war premium grinds back into crude
    affects:
