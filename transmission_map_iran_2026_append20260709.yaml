iran_2026_full_escalation:
  description: >
    ELEVATED TAIL (0.35). The current strike exchange tips into sustained war:
    the US reinstates the naval blockade, seizes or strikes Kharg Island and
    Iranian electricity/water plants; Iran mines Hormuz and hits Gulf infra and
    US bases. A hard chokepoint closure removes ~20-25% of seaborne crude and
    ~20% of LNG, producing a disorderly oil gap-up off the weak ~78 base, a
    global growth shock and a classic flight-to-quality into gold, the dollar
    and the long-end once recession risk overwhelms the Fed-tightening fear.
    Copper and aluminium are dragged down as the growth shock dominates the
    supply bid; petrocurrency and haven channels compete, leaving NOK/CAD and
    USD/JPY genuinely ambiguous.
