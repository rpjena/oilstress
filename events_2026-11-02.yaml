# ── Non-martingale components ──
common:
  event_vol_crush:
    applies_to: [DD, DR, RR, RD]
    description: >
      Election premium in implied vol bleeds out on resolution regardless of winner.
      BACKTEST (2006-2022): VIX day-1 change mean −1.21 (4/5 negative; t=0.4 vs −1.5); 1M mean −0.61 (noise).
      Reviews: 10-19 (VIX 19.99, AI stress → not scaled up); 10-22 (VIX 16.68) unchanged; 10-26 (VIX 19.45,
      oil/Iran + AI-capex stress, not election premium) unchanged; 10-30 (VIX 17.20) unchanged; 11-02 (VIX 19.42, AI/semis selloff — not election premium) unchanged.
    shocks_by_horizon:
      1D: {VIX: -1.5}
      1M: {VIX: 0.0}

overlays:
  CONTESTED:
    prob_subjective: 0.12
    combine_with: [DD, DR]
    review_2026-11-02: >
      RAISED 0.07 → 0.12. First change since 10-05, driven by a specific, sourced mechanism rather than race
      drift. Back-of-envelope (stated so it can be challenged):
        P(contested) ≈ P_generic + P(AK pivotal) × P(Peltola wins | pivotal) × P(fight >1 week | that)
        P_generic ≈ 0.04 (any decisive race inside recount margin / litigation; pivotal races now at 69-77% D,
          implied margins ~3-5pt, so a sub-0.5pt finish in a decisive seat is a few-percent event)
        P(AK pivotal) ≈ 0.20-0.30 (D has several paths: MI/OH/TX/ME all ~70%)
        P(Peltola wins) ≈ 0.71 (market); P(certification fight >1 week | Peltola wins & pivotal) ≈ 0.5-0.7
          (DOJ appeal pending; governor signalled he may not certify; RCV + mail to 11-13 already makes AK slow)
        → 0.04 + (0.20-0.30)(0.71)(0.5-0.7) ≈ 0.04 + 0.07-0.15 ≈ 0.11-0.19. Point estimate 0.12 (lower half,
          because federal courts have already rejected the theory once).
      SHOCK CALIBRATION CAVEAT: the CONTESTED shock vector is calibrated to a litigated, Bush-v-Gore-type process.
      An Alaska certification fight with a known vote leader is probably milder for broad indices; the vector is
      kept (conservative) but this is the main reason the probability was not set higher.
    review_2026-10-30: >
      Unchanged at 0.07. More races near 50% (IA 47, KS 46) but these are not the 51st seat in most paths
      (TX 69 / OH 68 / ME 62 are). Upward and downward evidence roughly offset; no recount-margin model yet.
    review_2026-10-26: >
      Unchanged. Races partly reverted toward 50% (ME 64→60, TX 68→65), offsetting last week's downward lean.
    review_2026-10-22: >
      Unchanged at 0.07, with a downward lean recorded: the pivotal 51st-seat races (OH 69, TX 68, ME 64) all
      moved away from 50%, so the chance that control hinges on a recount-margin race is probably lower.
      Not cut because no race-level recount-margin model exists yet — changing it without one would be noise.
    description: >
      Senate control unresolved for >1 week (recounts / litigation). US-origin process risk ⇒ USD does
      not get the usual haven bid; JPY and gold do.
    analog: "2000-11-07 -> 2000-12-12 (Bush v Gore); 2025-04 US-origin risk-off for FX sign"
    shocks: {ES: -3.0, NQ: -3.5, RTY: -4.0, VG: -2.0, GX: -2.0, NK: -3.0, HSI: -2.0, GC: 3.0, CL: -1.0,
             CO: -1.0, BTC: -8.0, DX: -0.5, EC: 0.5, JY: 2.0, MP: -1.0, ZT: -8, ZN: -10, SR3: -5, VIX: 6.0}
  TP_TANTRUM:
    prob_subjective: "0.35 conditional on RR; 0.05 otherwise"
    combine_with: [RR]
    review_2026-11-02: >
      Unchanged at 0.35 | RR. Into the event the equity–bond correlation is NEGATIVE (stocks and yields both down
      on 10-30), which argues against a tantrum, but the branch is about a fiscal-dominance read specific to RR,
      which current trading cannot test. Combo starts from 10y 4.94%.
    review_2026-10-30: >
      Unchanged. Post-FOMC 10y 5.05% then 4.98% despite 3.6% PCE — no RR-specific information. Combo starts
      from 10y 4.98%.
    review_2026-10-26: >
      Unchanged. 10y back to 5.00% after a 19bp flight-to-quality drop; French spread at 2011 wides adds to
      global term-premium fragility but is not RR-specific. Combo starts from 10y 5.00%.
    description: >
      Fiscal-dominance read: term premium gaps higher, positive equity-bond correlation, 'sell-America' ⇒
      USD down, gold up. Flips the sign of the RR equity response.
    analog: "2025-04 (10y +~50bp/wk, DXY down ~4%); 2022-09 UK LDI; 1994 bond massacre"
    shocks: {ES: -5.0, NQ: -6.5, RTY: -6.0, VG: -3.0, GX: -3.0, NK: -4.0, HSI: -3.0, GC: 4.0, CL: 0.0,
             CO: 0.0, BTC: -10.0, DX: -1.5, EC: 1.5, JY: 1.0, MP: -2.0, ZT: 15, ZN: 45, SR3: 15, VIX: 7.0}
  IRAN_POSTELECTION:
    prob_subjective: "0.50 conditional on RR; 0.40 on DR; 0.35 on DD/RD (strike resumption within the 1M window, GIVEN no strike before 11-03)"
    combine_with: [RR, DR, DD]
    review_2026-11-02: >
      HELD at 0.50 / 0.40 / 0.35. Since 10-30 the US tone softened at the margin (Rubio: no decision, prefers a
      peaceful outcome; Trump "not in that much of a hurry") while Iran hardened (readiness, explicit
      preemption warning, unchanged five conditions behind the 2-day plan). The Iranian-initiation risk is
      handled by widening meta.conditioning (pre-event) rather than by this post-event probability. No net
      update to US-resumption odds within the window.
    review_2026-10-30: >
      RAISED +5pt (from parent 10-26: 0.45 / 0.35 / 0.30). Decision made fresh against the 10-26 parent;
      the ignored 10-28 run is not referenced. FOR: post-election operational readiness is now reported by
      several independent outlets (CNN 10-26 plans; Fox 10-29 options being readied; WSJ 10-29 commander
      briefing; AP allies told to prepare); Trump's "anything's possible" on post-election strikes;
      Netanyahu pushing; energy majors pulling staff from Abu Dhabi. AGAINST: an opened channel (Vance letter
      to Rezaee received), regional talks in Tehran, Iran's 7-day Hormuz plan. The diplomacy is real but
      both sides restated fixed terms (Iran's "seven conditions"; Trump denies talks), so the against-
      evidence does not offset the shift from intent to operational readiness.
      CAVEAT (strengthened): five upward steps (RR 0.30 → 0.50 since 10-12). The level is subjective and is
      now material to the window; it must be reconciled with the Iran-Hormuz framework before 11-03.
    review_2026-10-26: >
      RAISED +5pt again (was 0.40 / 0.30 / 0.25). For: Trump openly weighing "finish it off" vs a deal and
      "maybe tomorrow"; third carrier group; intelligence memo on Iranian targeting of Americans; reported
      post-midterm US/Israel strike plans; Aramco HQ evacuation. Against: Qatari mediation in Tehran; Trump
      still presents a deal as possible. CAVEAT: this is the fourth consecutive upward step (0.30→0.45 on RR
      in three weeks). Each step is evidence-driven, but the level is subjective and should be reconciled
      with the Iran-Hormuz framework's own Escalation probability (35% at the 07-09 anchor) when linked.
      Conditioning: these are probabilities GIVEN no pre-election strike (meta.conditioning).
    review_2026-10-22: >
      RAISED a further +5pt in every outcome (was 0.35 / 0.25 / 0.20). For: talks stalled with hardened Iranian
      red lines; FT report that Trump blocked an Israeli strike plan specifically to avoid pre-midterm
      escalation (restraint is tied to the election date, not to diplomacy); ordered departure of
      non-emergency US staff from Saudi Arabia and a quieter US force footprint (consistent with force
      protection ahead of operations, though also with de-risking); Houthi strikes on Saudi energy assets.
      Against: White House reaffirmed the pre-election pledge only; Trump says the US is "doing very well
      with Iran". Outcome gradient unchanged.
    review_2026-10-19: >
      RAISED +5pt in every outcome (was 0.30 / 0.20 / 0.15). Evidence: reported order for the military to
      be ready for larger attacks after Nov 3; October has the most ship attacks of the war; Brent at a
      5-month-high settle. Offsetting: Trump says Iran asked for a halt and talks are ongoing. Net: the
      post-election window carries more resumption risk than a week ago. Outcome gradient unchanged.
    description: >
      Trump's 'no attack before Nov 3' pledge lapses on election day. Resumption risk sits inside the
      post-election window for every outcome; weak outcome-dependence because the June-2026 War Powers
      resolution already passed under R control. Evidence of scale: 10-08 strike-plan headlines moved
      Brent ~+5% intraday; 10-16 attack wave moved Brent +3.7% d/d.
    shocks_source: "iran-hormuz scenario framework — Escalation branch (last anchored 2026-07-09; REFRESH before use)"
    shocks: null     # deliberately not invented here; engine skips with a warning until linked

