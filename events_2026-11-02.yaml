# US MIDTERM 2026 — EVENTS CATALOG
# anchor_date : 2026-11-02   (ELECTION EVE; prediction markets 2026-11-01 09:11 ET – 2026-11-02 01:10 ET; prices = Fri 2026-10-30 close)
# event_date  : 2026-11-03   (Tue; first full reaction = Wed 2026-11-04)
# horizon     : 1M  (2026-11-03 close → ~2026-12-03 close)
# supersedes  : events_2026-10-30.yaml   (lineage …-10-22 → 10-26 → 10-30 → 11-02; 10-28 ignored)
#
# Model:  Δ_ik = Σ_f β_if · (x_fk − Σ_l p_l x_fl)   + common_k(h) + overlay
#         └ information shock, mean-zero under p ┘  └ non-martingale terms ┘
# ─────────────────────────────────────────────────────────────────────────────
meta:
  anchor_date: "2026-11-02"
  price_date: "2026-10-30"
  conditioning: >
    These scenarios are CONDITIONAL ON NO MAJOR US–IRAN KINETIC ESCALATION — BY EITHER SIDE — BEFORE THE
    11-03 CLOSE. WIDENED 2026-11-02 (was "no US strike"): Iran has now explicitly raised the possibility of
    acting first — Khamenei ordered commanders to prepare retaliation and expand the target bank (10-31);
    Ali Abdollahi warned Iran may act preemptively if it detects hostile moves (10-31); defence minister vowed
    a response "without geographical limits" (11-01). Routine Hormuz/Houthi incidents (projectile and mine
    strikes on tankers, Houthi missiles at Saudi targets) are part of the base and do NOT trigger.
    RE-ANCHOR TRIGGER: a US/Israeli strike on Iranian territory, or an Iranian strike on US forces or Gulf
    state territory beyond the current Houthi/tanker pattern, before 11-03 → discard this anchor.
    STATUS 2026-11-02: NOT fired. Rubio (10-31/11-01): Trump "hasn't made a decision", US "would prefer to do
    it peacefully"; more strikes "on the table, but not likely before midterms" (Fox). Trump (10-31): "We're
    not in that much of a hurry". Pledge stands until 11-03.
  probability_source: >
    DeFi Rate balance-of-power page, observed 2026-11-02 01:10 ET (combo prices ≈ ask).
    Kalshi / Polymarket: DD 71c/72c, DR 25c/24c, RR 6.4c/6c, RD 0.50c/0.70c, Polymarket 'Other' 0.1c.
    Method as at 10-30: all four outcomes from the combo page (single observation); renormalisation removes
    the common ask bias.
    Used: DD 0.715, DR 0.245, RR 0.062, RD 0.006; raw sum 1.028 → renormalised in engine to
    DD 0.696, DR 0.238, RR 0.060, RD 0.006.
    Consistency check: P(Senate D) = 0.701 vs headline 72% (Kalshi 71.5c, Polymarket 73c; observed 11-01) —
    within 2pt and the two pages were read 16h apart ✓; P(House D) = 0.934 vs 94% ✓.
  macro_backdrop:
    fed_funds_target: "3.75-4.00% (10-28 hawkish hold, 10-2). No FOMC in window; next 2026-12-09."
    fomc_pricing: "2026-12-09 hike 71% (Kalshi 70.5c / Polymarket 70.5c, DeFi Rate 11-01; was 77% on 10-29). ≥1 more hike in 2026: 72%."
    ust: "Treasury.gov 10-30: 2y 4.56, 10y 4.94, 30y 5.31 (10-29: 4.61 / 4.98 / 5.32). Bull flattener into the event on safe-haven demand."
    equities: >
      PRE-EVENT RISK-OFF. 10-30: S&P 7,580.07 (−1.82%), NDX 28,384.85 (−3.46%), Nasdaq worst day since June; SOX −7.2%
      on Intel guidance + Amazon capex + weak hyperscaler free cash flow; Tech −4.9%; Russell −1.7%. Week: S&P −0.6%,
      Nasdaq −2.0%. VIX 19.42 (+12.9%), touched ~24 intraday. Energy, Staples, Utilities up.
    oil: >
      Brent JAN $113.43 (+2.37%) on 10-30 — Dec contract expired 10-30 at $117.64; WTI Dec $104.12 (+2.08%). Mines/
      projectiles hit tankers near Hormuz (10-28, 10-30, 10-31 Iranian claim). Brent +11% in October.
    precious_metals: "Gold Dec $3,898.90 (−3.3% d/d) — higher-for-longer Fed + liquidation; a one-year low per CappNotes."
    crypto: "BTC ~$76.8k (−1.3%) after a reported ~$6.3bn Binance hack (investrade/CappNotes) — idiosyncratic to crypto, not an election channel."
    iran: >
      No strike (see conditioning). Qatar-mediated 2-day Hormuz reopening plan (Araghchi 11-01), but only after the
      US accepts five unchanged conditions (sanctions, force reduction, oil waivers, frozen assets, Iran–Oman corridor);
      no US response. US and Iran have not agreed to resume direct talks; Trump says the Vance letter was about
      medical supplies only. Iran raised military readiness across the Gulf and borders (10-31).
    election_process: >
      NEW. Alaska Senate (Peltola D 71%): DOJ sued (10-22/23) to block certification if Sen. Sullivan loses, citing
      a second "Dan J. Sullivan" on the ballot; Judge Gleason DISMISSED on 11-01 ("infeasible"; Purcell; state
      authority); DOJ filed notice of APPEAL the same day; Alaska's Republican governor ordered an investigation and
      suggested he may not certify a Peltola win; DOJ grand-jury subpoenas into the second candidate (10-29).
      Count timing: Alaska scans mail only after polls close and accepts mail until 11-13 (RCV rounds after; target
      certification 11-25); Maine RCV historically ~1 week (certification 11-23); Texas and Kansas accept mail after
      Election Day; Ohio/Michigan have margin-based automatic recounts (0.25% / 0.1%).
    fiscal: "FY27 CR funds government through 2026-12-11 (unchanged)."
    politics: >
      Senate D 72% (+7 w/w), House D 94%. Races (Kalshi D, 7d): MI 77 (+10), OH 72 (+4), AK 71 (−5), TX 70 (+6),
      ME 69 (+8), KS 51 (+11), IA 44 (+2), SC 28 (+7).
    regime_note: >
      Into the event: equities falling, yields falling, VIX ~19-20 → NEGATIVE equity–bond correlation (flight to
      quality), the opposite of the TP_TANTRUM premise. Much of the VIX level is AI-capex/semis stress, not
      election premium.

