# ─────────────────────────────────────────────────────────────────────────────
# US MIDTERM 2026 — TRANSMISSION MAP   (anchor 2026-10-19; supersedes 2026-10-12)
# β_if = 1M response of instrument i to a +1 unit surprise in factor f.
# Units: equities/commodities/crypto/FX futures = % price; ZT/ZN/SR3 = bp YIELD
#        (price P&L via DV01, sign flipped); VIX = absolute vol points.
# FX futures are quoted as USD per foreign unit: EC +1% = EURUSD +1%;
#   JY +1% = JPY strengthens (USDJPY ≈ -1%); MP +1% = MXN strengthens.
# vol_ann anchors the residual-noise scale to the CURRENT regime (2026-10-16 close). vol_ann affects only the
# adverse-residual P&L, never the scenario shocks.
# tier: 1 direct channel | 2 secondary | 3 behavioural/weak
#
# PROVENANCE: all β are structural PRIORS (sign from channel, magnitude from 2016/2024 sweep
# analogs scaled for midterm legislative vs executive powers). They are NOT fitted.
# Out-of-sample backtest on 2006/2010/2014/2018/2022 (backtest/RESULTS.md): power ≈ 0 at 1M
# (|pred|/σ = 0.07); day-1 sign agreement 12/43; the only informative event (2006 Senate flip)
# got rates right and equities wrong. FISC/REG were never exercised by a midterm surprise.
# ─────────────────────────────────────────────────────────────────────────────
factor_rationale:
  FISC: >
    Deficit-financed fiscal impulse in a 5%+ yield, Fed-hiking regime: front end
    reprices hikes (ZT, SR3 up), term premium up (ZN up more), USD up via rate
    differential, small caps (domestic, levered) outperform, gold down on real
    rates; tariff-hawkish continuation weighs on EU/China equities, MXN.
    Elasticity anchors: 2016 sweep (10y ≈ +50bp, RTY ≈ +11%, DXY ≈ +3-4% over 1M)
    and 2024 sweep (BTC ≈ +40%, DXY ≈ +2.5%), scaled DOWN because a midterm
    changes legislative capacity, not the executive.
  REG: "Bank/small-cap deregulation and crypto market-structure legislation; BTC is the purest expression."
  GRID: >
    Oversight, shutdown/appropriations brinkmanship (Dec-11 CR cliff), impeachment noise: mild risk-off,
    VIX up, gold up, front end down. US-equity GRID betas HALVED on 2026-10-12: in the 2006 Senate-flip
    surprise (GRID +0.47) the S&P rose +0.2% d1 / +1.8% 1M vs a predicted -1.3%, consistent with the
    "gridlock is good" pattern. One event => shrink toward 0, do not flip the sign.
  FEDI: "Senate controls Fed Board confirmations; R-Senate retention raises perceived political pressure on policy -> breakevens/term premium up, gold up, USD down, front end slightly down (dovish tilt)."
  WARP: >
    D-controlled chambers raise odds of binding War-Powers / appropriations limits on Iran operations ->
    lower oil risk premium. Betas UNCHANGED; the 2026-10-12 update rescales the factor STATES instead
    (June-2026 WPR passed under R control => smaller incremental effect). Changing both would double count.
    Strike-resumption risk after the 11-03 pledge lapse is an overlay (IRAN_POSTELECTION), not WARP.

