plausibility_gate:
  band:
  - 0.005
  - 0.1
  reference: multivariate t, nu = 12
  radius_convention: marginal
  note: TWO DEVIATIONS FROM v2, both load-bearing. (1) The radius is computed on the MARGINAL sub-covariance
    of the shocked nodes. Using the full inverse with zeros gives x_A' (Sigma^-1)_AA x_A, which is the
    Mahalanobis distance of A CONDITIONAL on the unshocked nodes being pinned at zero; testing that against
    the marginal F(d,4) mixes two distributions and inflates R, because the Schur complement is no larger
    than Sigma_AA. A scenario declines to speak about the unshocked nodes, it does not assert they are
    zero. (2) nu = 12, not 4. A tail index of 4 is a DAILY figure; these shocks are 21-day aggregates
    and aggregation pulls the multivariate law toward Gaussian. At nu = 4 a capitulation sized to exactly
    the realised 2026 cycle drawdown (NDX -17.6 percent peak to trough) scores a 21 percent tail and fails
    the ceiling, so the gate as written can only be satisfied by authoring roughly twice the severity
    the cycle has actually produced. Both p_t4 and p_t12 are reported per scenario so nothing is hidden.
probability_update:
  prior_from: no prior anchor date in this session
  evidence:
  - observable: Combined hyperscaler 2026 capex guidance
    value: USD 732.5bn, 39 percent above Nov-2025 expectations; 2027 consensus near USD 1tn
    source: Goldman Sachs / FactSet via io-fund, Aug-2026
    favours: ai_compute_supercycle
    bayes_factor: 2.1
  - observable: Oracle 5-year CDS and rating
    value: roughly 200bp versus roughly 40bp a year ago; S&P cut to BBB-
    source: Reuters / LSEG via Qz, 15-Aug-2026
    favours: ai_credit_event
    bayes_factor: 2.6
  - observable: Alphabet 5-year CDS
    value: record 67bp after negative Q2 free cash flow
    source: LSEG via Yahoo Finance, Jul-2026
    favours: ai_credit_event
    bayes_factor: 1.7
  - observable: Off-balance-sheet contingent liabilities under scrutiny
    value: roughly USD 70bn linked to major AI borrowers
    source: Qz update, 17-Aug-2026
    favours: ai_credit_event
    bayes_factor: 1.5
  - observable: SOX versus its 52-week high
    value: roughly 11,900-12,100 against a 52-week high of 14,655, about -18 percent
    source: Investing.com / Nasdaq index history, Aug-2026
    favours: ai_capex_capitulation
    bayes_factor: 1.6
  - observable: Hardware versus platform dispersion year to date
    value: SanDisk +411 percent, Micron and Intel more than doubled, against Mag7 +5.2 percent through
      10-Aug
    source: Zacks / BeInCrypto, Aug-2026
    favours: ai_efficiency_shock
    bayes_factor: 1.4
  - observable: DRAM supply-demand sufficiency ratio
    value: -1 to -2 percent for 2026, gap widening into 2027
    source: TrendForce 2027 Memory Market Outlook, 30-Jul-2026
    favours: ai_supply_rupture
    bayes_factor: 1.3
  posterior_check: No previous anchor date exists in this session, so these are initialising likelihood
    ratios applied to a uniform 0.20 prior rather than a genuine update. The sequence is unscored until
    a second anchor date exists -- an unscored probability sequence is a narrative, not a forecast.
