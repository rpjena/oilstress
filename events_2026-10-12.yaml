  - "Mid Nov: October CPI (BLS schedule — verify date)"
  - "2026-12-09 FOMC (just outside 1M window; hike ~74% priced → path repricing happens inside window)"
  - "2026-12-11 CR expiry (lame-duck appropriations; just outside window, priced inside)"

