  - {name: "2010 midterm", t0: "2010-11-02", type: RD, prior: "Intrade 11-01: R House 93.8%, R Senate 14.5%", confounders: "QE2 announced 2010-11-03 (inside day-1 window)"}
  - {name: "2014 midterm", t0: "2014-11-04", type: RR, prior: "538: R Senate 76%; WaPo: R House 99%", confounders: "OPEC Thanksgiving oil crash"}
  - {name: "2018 midterm", t0: "2018-11-06", type: DR, prior: "538: D House ~86%, R Senate ~81%", confounders: "Q4-18 Fed tightening sell-off"}
  - {name: "2022 midterm", t0: "2022-11-08", type: RD, prior: "538 Deluxe: R House 84%, R Senate 59%", confounders: "FTX collapse 11-09; CPI 11-10"}
  - {name: "2016 presidential (sweep surprise)", t0: "2016-11-08", type: RR_elasticity, note: "IN-SAMPLE calibration anchor — not a test"}
  - {name: "2024 presidential (sweep)", t0: "2024-11-05", type: RR_elasticity, note: "IN-SAMPLE calibration anchor — not a test"}

