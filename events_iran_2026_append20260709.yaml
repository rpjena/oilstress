iran_2026_rapid_resolution:
  description: "The signed MoU is restored and honoured: strikes stop, Hormuz normalises under the Oman-administered framework, idled Gulf production and LNG restart and the war premium (already thin, given weak physical crude) fully exits. Disinflation revives Fed-cut pricing and EM/petro-credit compresses, though Qatar LNG damage and shut-in restart lags plus a July heatwave keep a floor under gas."
  shock_direction_oil: "down"
  instances:
    - name: "Iran 2026 Rapid Resolution"
      t0: "2026-07-09"
      notes: >
        Path back to the Jun-17 signed MoU: ceasefire re-holds, blockade threat
        withdrawn, Hormuz tolls dropped. Brent target ~68-72 (from ~78 anchor;
        limited downside since physical crude is already soft and near pre-war
        ~71 on OPEC+ supply). TTF ~38-42 (from ~44-48; capped by low ~49%
        EU storage and heatwave power demand). S&P direction up (+2 to +4%
        from ~7483). Gold stays soft as the rate-hike channel dominates even
        in relief. [WINDOW FLAG: 30-day window is roughly FAIR here -- little
        further oil downside to capture given the weak physical base, unlike
        the Jun-15 resolution case where much more premium remained to exit.]
        Structural caveat: Qatar LNG train damage + restart lags floor TTF.

iran_2026_extended_stalemate:
  description: "BASE CASE. The MoU survives on paper but is not honoured: intermittent US-Iran strikes, Iran asserting toll/control over Hormuz, insurance and traffic not normalised. War premium grinds on top of a weak physical crude base rather than spiking. Sticky energy plus a hawkish Fed (9-9 split on 2026 hikes) keep real yields elevated, so gold is pressured by the USD/real-rate channel rather than bid as a haven -- empirically confirmed and directly observed this anchor."
  shock_direction_oil: "up"
  instances:
    - name: "Iran 2026 Extended Stalemate"
      t0: "2026-07-09"
      notes: >
        Nominal MoU, no durable ceasefire; Hormuz partial, war-risk insurance
        elevated, tanker attacks recur. Brent target range ~85-95 (from ~78
        anchor). TTF ~50-62 (EU storage only ~49% full vs ~60% a year ago;
        heatwave compounds). Compounding: Gulf floating storage, Iranian oil
        waiver revoked, shut-ins persist, OVX elevated. Gold direction '-'
        (stagflation + hawkish-Fed + strong-USD dominates the haven bid;
        confirmed this anchor -- gold fell on the Jul-8 escalation). S&P
        modestly lower. [WINDOW FLAG: 30-day window roughly FAIR for this
        grind case.]

iran_2026_full_escalation:
  description: "ELEVATED (0.35). The current strike exchange tips into sustained war: US reinstates the naval blockade, seizes/strikes Kharg Island and Iranian electricity/water plants; Iran mines Hormuz and hits Gulf infrastructure and bases. A hard chokepoint closure removes ~20-25% of seaborne crude and ~20% of LNG, producing a disorderly oil spike off the weak ~78 base, a global growth shock and a classic flight-to-quality once the Fed-tightening fear is overwhelmed by recession risk."
  shock_direction_oil: "up"
  instances:
    - name: "Iran 2026 Full Escalation"
      t0: "2026-07-09"
      notes: >
        Blockade reinstated + Kharg seizure + power/desal-plant strikes +
        Hormuz mining. Brent target ~140-180 (from ~78 anchor; slightly lower
        band than prior refreshes because the physical base is softer and OPEC+
        spare capacity is higher, though the chokepoint dominates). TTF
        ~90-130 on LNG chokepoint + low storage + heatwave. S&P down sharply
        (-12 to -20%); VIX +25 to +40 vol pts (from a low ~17 base -- large
        room to spike). Recession probability ~40-55% within 12m. Gold '+'
        (only escalation of THIS magnitude tips the balance back to the haven
        bid, overriding the Fed channel). [WINDOW FLAG: 30-day window
        OVERSTATES sustained stress if mines are cleared fast, UNDERSTATES the
        initial gap-spike; treat the 30d mean as a blend of an extreme first
        week and partial mean-reversion.]
