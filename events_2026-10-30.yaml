    The pre-election pledge (10-08; restated by the White House 10-20) can no longer be treated as firm:
    Trump 10-24 "We're thinking about doing it, and maybe tomorrow"; Amb. Barrack said a strike was
    "absolutely" possible / "as soon as this weekend"; Trump 10-25 "there will not be a strike today" and
    "Do I finish it off ... or do I make a deal?". RE-ANCHOR TRIGGER: if a strike occurs before 11-03,
    discard this anchor — base prices, outcome probabilities (possible rally/backlash effect on the vote)
    and the IRAN_POSTELECTION overlay all change; the overlay would then be partly realised in the base.
    STATUS 2026-10-30: trigger NOT fired — no US strike through the 10-29 close (Fox live 10-29; Rigzone
    10-29). Trump, asked about striking after the US and Israeli elections: "I can't tell you that... but
    anything's possible."
  event_date: "2026-11-03"
  horizon: "1M"
  probability_source: >
    DeFi Rate balance-of-power page, observed 2026-10-30 01:21 ET (combo prices ≈ ask).
    Kalshi / Polymarket: DD 67c/69c, DR 27c/25c, RR 8c/7c, RD 0.80c/0.80c, Polymarket 'Other' 0.1c.
    METHOD DECISION (made fresh at this anchor): the control page no longer labels an RR midpoint (Kalshi
    8.6c unlabelled; Polymarket 6.5c headline vs 7c ask), so all four outcomes use the combo-page prices
    from a single observation; renormalisation removes their common ask bias. (Parent 10-26 used an RR
    midpoint average; using it here — (8.6+6.5)/2 = 7.55c — would change RR by <0.1pt.)
    Used: DD 0.680, DR 0.260, RR 0.075, RD 0.008; raw sum 1.023 → renormalised in engine to
    DD 0.665, DR 0.254, RR 0.073, RD 0.008.
    Consistency check: P(Senate D) = 0.673 vs headline 67% (Kalshi 66.9c, Polymarket 68c) ✓;
    P(House D) = 0.919 vs 92% ✓.
  macro_backdrop:
    fed_funds_target: >
      3.75-4.00%. FOMC 10-28 HELD, 10-2 vote (two dissents for +25bp). Statement: activity upgraded from "solid"
      to "strong pace"; dropped the September "timelier return" to 2% framing. Warsh: conditions "tighter, but
      they're not tight"; no December guidance (FHLBank Boston analysis).
    fomc_pricing: "2026-12-09 hike 77% (Kalshi 76.5c / Polymarket 76.5c, DeFi Rate 10-29). ≥1 more hike in 2026: 78%. Mar-2027 hike 54% (Kalshi)."
    data: >
      Q3 GDP 3.4% annualised (exp 3.1%, Q2 2.2%). Sep PCE +0.5% m/m (in line), 3.6% y/y (CappNotes).
      Conference Board confidence (10-27) at its highest since June.
    ust: "Treasury.gov 10-29: 2y 4.61, 10y 4.98, 30y 5.32 (10-23: 4.69 / 5.00 / 5.33; 10-28 post-FOMC 10y 5.05)."
    equities: >
      S&P 7,720.39 (+1.3% vs 10-23), Russell 2000 2,859.22 (+3.0%); Nasdaq Comp −1.38% on 10-29 as Alphabet fell
      12.6% (worst day ever) on a search/FCF miss — AI-capex doubts again; equal-weight S&P +1.2% (rotation). VIX 17.20.
    oil: >
      10-29 settles: Brent Dec $114.88 (expires 10-30), Brent JAN $110.80, WTI Dec $102.00 (Rigzone; Nation Thailand).
      Brent +11% in October, six-month high. Brent reversed higher after settlement on a WSJ report that the top US
      Middle East commander briefed Trump on military options; WTI Dec 102.81 in early Asia 10-30 (after snapshot).
      Houthi claims on Saudi refineries/Aramco; tankers hit near Hormuz; Shell CEO: global stocks very low.
      Offsets: Russian refinery runs up; Europe to release 42mb over three months.
    iran: >
      No strike. Escalation signals since 10-26: CNN (10-26) US has plans for major strikes if Trump chooses;
      Fox (10-29) officials say military options are being readied "if he decides to resume attacks"; WSJ (10-29)
      CENTCOM commander briefed Trump; AP: regional allies told to prepare; Trump signals resumption after the
      midterms, possibly with Israel; Netanyahu pushing; Exxon/Chevron pulled executives from ADIPEC (security).
      Diplomacy: Saudi/Turkey/Pakistan talks in Tehran (10-26); Iran's 7-day Hormuz-reopening plan; VP Vance letter
