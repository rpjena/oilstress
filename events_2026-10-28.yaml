    "absolutely" possible / "as soon as this weekend"; Trump 10-25 "there will not be a strike today" and
    "Do I finish it off ... or do I make a deal?". RE-ANCHOR TRIGGER: if a strike occurs before 11-03,
    discard this anchor — base prices, outcome probabilities (possible rally/backlash effect on the vote)
    and the IRAN_POSTELECTION overlay all change; the overlay would then be partly realised in the base.
    STATUS 2026-10-28: trigger NOT fired — no US strike through the 10-27 close (Rigzone, CappNotes, CBS live).
    Trump (Fox, ~10-27): "getting to be decision time"; has suggested strikes could resume after 11-03.
  event_date: "2026-11-03"
  horizon: "1M"
  probability_source: >
    DeFi Rate balance-of-power page, observed 2026-10-28 02:27 ET (combo prices ≈ ask).
    Kalshi / Polymarket: DD 63c/66c, DR 29c/27c, RR 9c/8c, RD 0.80c/1.1c, Polymarket 'Other' 0.1c.
    CONVENTION CHANGE: RR midpoints not published this observation (control page shows asks Kalshi 9.3c /
    Polymarket 8c), so RR uses the combo-page prices like the other three outcomes. Renormalisation absorbs
    the common ask bias.
    Used: DD 0.645, DR 0.280, RR 0.085, RD 0.0095; raw sum 1.0195 → renormalised in engine to
    DD 0.633, DR 0.275, RR 0.083, RD 0.009.
    Consistency check: P(Senate D) = 0.642 vs headline 65% (−0.8pt, within venue spread) ✓;
    P(House D) = 0.908 vs 90.7c (Kalshi) / 92c (Polymarket) ✓.
