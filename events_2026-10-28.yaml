    fed_funds_target: "3.75-4.00%. FOMC decision TODAY 2026-10-28 14:00 ET — AFTER this snapshot (hike 6%, hold ~94%)."
    fomc_pricing: "2026-12-09 hike 74-78% (DeFi Rate 10-27); investrade cites 83%. ≥1 more hike in 2026: 77%."
    data: "Conference Board consumer confidence (10-27) highest since June as gas prices and inflation expectations eased. Q3 GDP and Sep core PCE later this week (verify dates)."
