      Jan-2027; Senate can block Fed nominations; investigations; no reconciliation 2.0. Lame-duck (current R
      Congress) still owns the Dec-11 funding cliff. 51st-seat candidates: OH 68%, TX 65%, ME 60%.
  DR:
    label: "Dem House / Rep Senate"
    prob_market: 0.270
    state: {FISC: 0.0, REG: 0.1, GRID: 0.5, FEDI: 1.0, WARP: 0.3}
    narrative: >
      Classic split. House oversight + power of the purse; Senate keeps confirming nominees.
