meta:
  anchor_date: "2026-10-26"
  price_date: "2026-10-23"
  conditioning: >
    NEW 2026-10-26. These scenarios are CONDITIONAL ON NO US STRIKE ON IRAN BEFORE THE 11-03 CLOSE.
    The pre-election pledge (10-08; restated by the White House 10-20) can no longer be treated as firm:
    Trump 10-24 "We're thinking about doing it, and maybe tomorrow"; Amb. Barrack said a strike was
    "absolutely" possible / "as soon as this weekend"; Trump 10-25 "there will not be a strike today" and
    "Do I finish it off ... or do I make a deal?". RE-ANCHOR TRIGGER: if a strike occurs before 11-03,
    discard this anchor — base prices, outcome probabilities (possible rally/backlash effect on the vote)
    and the IRAN_POSTELECTION overlay all change; the overlay would then be partly realised in the base.
  event_date: "2026-11-03"
  horizon: "1M"
  probability_source: >
    DeFi Rate balance-of-power page, observed 2026-10-26 02:32 ET (combo prices ≈ ask).
    Kalshi / Polymarket: DD 64c/66c, DR 27c/27c, RR 11c/8c (midpoints 10.5c/7.5c on the control page,
    observed 01:53 ET), RD 0.70c/1.0c, Polymarket 'Other' 0.1c.
    Used (same convention as prior anchors): DD 0.650, DR 0.270, RR 0.090 (midpoint average), RD 0.0085;
    raw sum 1.0185 → renormalised in engine to DD 0.638, DR 0.265, RR 0.088, RD 0.008.
    Consistency check (after renormalisation): P(Senate D) = 0.646 vs headline 64-65% ✓;
    P(House D) = 0.903 vs 90.3c (Kalshi) / 93c (Polymarket) ✓.
  macro_backdrop:
    fed_funds_target: "3.75-4.00%; FOMC 10-27/28 this week (hike ~5%: Kalshi 5.5c, Polymarket 4.5c; was 12%)"
    fomc_pricing: "2026-12-09 hike 76-79% (DeFi Rate 10-26; investrade cites ~71%). ≥1 more hike in 2026: 78%."
    data_this_week: "FOMC 10-28; Q3 GDP and Sep core PCE (dates per BLS/BEA calendar — verify)."
    ust: >
      Treasury.gov 10-23: 2y 4.69, 10y 5.00, 30y 5.33 (10-21: 4.81 / 5.13 / 5.42). 10y fell ~19bp on 10-22
      (largest daily drop since Aug-2025) on an AI-capex flight to safety (Meta capex plans, Nasdaq −2.6%);
      partly retraced 10-23 as oil lifted inflation worries.
    equities: >
      S&P 7,623.68 (−0.5% w/w), NDX 28,957.53 (FRED), VIX 19.45. 10-22: AI-capex doubts (Nasdaq −2.6%).
      10-23: oil, not AI, the main worry; Dow −1.2%; chips steadied near 200-day MA.
    oil: >
      Brent (Dec) settled $116.72 on 10-23 (+3.1% d/d, ~+6% w/w, highest settle since 04-29; late-Friday
      quotes ~$117.2-117.3); WTI (Dec) $103.27. Drivers: Houthi claims of strikes on Aramco Yanbu, Rabigh
      refinery, East-West pipeline (unconfirmed by Saudi); intercepts near Yanbu, Taif, Riyadh, Mecca;
      Aramco evacuated Dhahran HQ (10-22); tanker hit leaving Hormuz (10-22); IRGC claims 4 US-linked tankers.
      DOE emergency SPR release up to 400kb. EIA spot Brent (FRED) 115.22 on 10-20 vs Dec futures 108.79 the
      same day → physical premium ~$6.4, down from ~$20 on 10-06 (spot 125.44 vs futures ~105).
    iran: >
      Strike risk now explicitly PRE- and post-election (see meta.conditioning). US moved a third carrier
      group toward the Gulf; US intelligence memo (10-23) says Iran "substantially increased" efforts to
      target Americans; US embassy Riyadh restricted staff movement; Netanyahu (10-21) says Trump told him the
      US is "ready to finish the job". Reports that US/Israel have post-midterm strike plans (AA 10-24).
      Diplomacy: Qatari delegation in Tehran (10-25) to restart talks; Iran says US "derailed talks";
      IRGC warns response "several times greater" to any action. Main sticking point: Hormuz navigation.
    fiscal: "FY27 CR funds government through 2026-12-11 (unchanged)."
    politics: >
      Senate D 64-65% (Kalshi 64.7c, Polymarket 65c); House D 90-93%. Races (Kalshi D): OH 68, TX 65,
      MI 67, ME 60, IA 42, KS 40. Generic ballot D+9.2 (Silver Bulletin 10-21).
    global: "France 10y spread widest since 2011 (10-23); weak French flash PMIs; Brazil runoff 10-25 (result not checked)."
    regime_note: >
      Oil shock + AI-capex doubts. Equity-bond co-movement flipped twice in two weeks (flight to quality 10-22,
      inflation-led selloff 10-23). TP_TANTRUM stays a tail branch.

